version: "3.9"

# ─────────────────────────────────────────────
#  AIOps Platform Engineering Assistant
#  Local Docker Compose stack
# ─────────────────────────────────────────────

# Shared environment block reused by backend + celery_worker
x-backend-env: &backend-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/aiops
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
  DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}

services:

  # ── 1. PostgreSQL ──────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aiops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 2. Redis (Celery broker + result backend) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── 3. FastAPI Backend ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── 4. Celery Worker ───────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Override CMD: start Celery instead of uvicorn
    command: >
      celery -A worker.celery_app worker
        --loglevel=info
        --concurrency=2
        --queues=celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── 5. Vite / React Frontend ───────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
