name: Daily Health Check

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

env:
  PORTAL_URL: ${{ secrets.PORTAL_URL }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check portal health
        id: health
        run: |
          set -eo pipefail
          if [ -z "$PORTAL_URL" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "HEALTH_FAILED=false" >> "$GITHUB_ENV"
            echo "PORTAL_URL secret not set — skipping remote probe"
            exit 0
          fi
          # Treat curl failure (portal fully down) as critical — otherwise the
          # pipe-swallowed error hides total outages behind a green run.
          BODY=$(curl -sfS --max-time 20 "$PORTAL_URL/api/health/summary") || BODY=""
          if [ -z "$BODY" ]; then
            STATUS="critical"
          else
            STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
          fi
          # Also probe readiness (db + redis) — summary alone can be green while deps are down.
          READY_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$PORTAL_URL/health/ready" || echo "000")
          if [ "$READY_CODE" != "200" ]; then
            STATUS="critical"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "critical" ] || [ "$STATUS" = "unknown" ]; then
            echo "HEALTH_FAILED=true" >> "$GITHUB_ENV"
          else
            echo "HEALTH_FAILED=false" >> "$GITHUB_ENV"
          fi

      - name: Notify Slack if degraded
        if: env.HEALTH_FAILED == 'true'
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL secret not set — skipping Slack"
            exit 0
          fi
          curl -sS -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"text":"🚨 Portal health check CRITICAL — investigate immediately"}'

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt
        continue-on-error: true

      - name: Node dependency audit
        run: npm audit --audit-level moderate
        continue-on-error: true

      - name: Docker image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: platform-assistant-portal:latest
          format: table
          exit-code: 0
        continue-on-error: true

      - name: Post health summary
        run: |
          echo "Health check completed at $(date -u)"
          echo "Status: ${{ steps.health.outputs.status }}"
