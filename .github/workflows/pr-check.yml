name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Backend tests
        run: |
          # Same lxml/xmlsec libxml2 version-mismatch fix as ci.yml: both ship
          # prebuilt manylinux wheels bundling their own libxml2, and loading two
          # of them in one process trips xmlsec's version check at import time
          # (conftest -> backend.main -> routers.sso -> onelogin -> xmlsec).
          # Force both to build from source against the system libxml2/libxslt.
          # This workflow only runs on pull_request, so it went unnoticed until
          # the repository's first PR.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
          pip install -r backend/requirements.txt
          pip install --no-cache-dir --force-reinstall --no-binary lxml,xmlsec lxml xmlsec
          pip install pytest httpx pytest-asyncio
          pytest backend/tests/ -v
      - name: Python dependency audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt
      - name: Frontend lint and tests
        run: |
          npm ci
          npm run lint
          npm run test
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Comment on PR if failed
        if: failure() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Tests failed. Please fix before merging.'
            })
