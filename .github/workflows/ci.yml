name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aiops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aiops_test
      SECRET_KEY: ci-jwt-secret-not-for-production
      LLM_MOCK: "1"
      SKIP_BACKGROUND_SCHEDULER: "1"
      ENV: test
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: Admin123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          # lxml and xmlsec both ship prebuilt manylinux wheels, each bundling its own
          # libxml2. Loading two different bundled libxml2s in one process trips xmlsec's
          # "lxml & xmlsec libxml2 library version mismatch" check (backend/routers/sso.py
          # imports onelogin -> xmlsec at collection time, so every test run hit this).
          # Force both to build from source against the system libxml2/libxslt so they
          # link the identical library — same fix already applied in backend/Dockerfile.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
          pip install -r backend/requirements.txt
          pip install --no-cache-dir --force-reinstall --no-binary lxml,xmlsec lxml xmlsec
          pip install pytest pytest-asyncio httpx
      - name: Run tests (Postgres)
        run: pytest backend/tests/ -v --tb=short
      - name: Security scan (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt
      - name: Security scan (safety)
        continue-on-error: true
        run: |
          pip install safety
          safety check -r backend/requirements.txt || true

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run ESLint
        run: npm run lint
      - name: Run unit tests
        run: npm run test
      - name: Check build
        run: npm run build
      - name: Audit packages (critical blocks CI)
        run: npm audit --audit-level=critical
      - name: Audit packages (moderate advisory)
        continue-on-error: true
        run: npm audit --audit-level=moderate

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: sqlite:///./backend/e2e_portal.db
      SECRET_KEY: e2e-jwt-secret-not-for-production
      LLM_MOCK: "1"
      SKIP_BACKGROUND_SCHEDULER: "1"
      ENV: test
      ENABLE_DEMO_DATA: "true"
      ENFORCE_WORKSPACE_ISOLATION: "false"
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: Admin123!
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install backend deps
        run: |
          # Same lxml/xmlsec libxml2 version-mismatch fix as backend-tests — this job
          # also imports backend.main (which imports the SSO router) to start uvicorn.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
          pip install -r backend/requirements.txt
          pip install --no-cache-dir --force-reinstall --no-binary lxml,xmlsec lxml xmlsec
      - name: Generate test encryption key
        run: echo "SECRETS_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Install frontend deps
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health/live; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Start frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run Playwright smoke
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare backend .env
        run: |
          if [ ! -f backend/.env ]; then
            cp backend/.env.example backend/.env || true
          fi
      - name: Build docker compose
        run: docker compose -f docker-compose.yml build
      - name: Test healthchecks
        run: |
          set +e
          docker compose -f docker-compose.yml up -d
          UP_RC=$?
          set -e
          # Poll /health/ready so Redis/DB failures fail CI.
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health/ready; then
              echo "Backend healthy"
              docker compose -f docker-compose.yml ps
              docker compose -f docker-compose.yml down -v
              exit 0
            fi
            echo "Waiting for backend health... attempt $i"
            sleep 5
          done
          echo "=== compose ps ==="
          docker compose -f docker-compose.yml ps || true
          echo "=== backend logs ==="
          docker compose -f docker-compose.yml logs backend --no-color || true
          echo "=== celery logs ==="
          docker compose -f docker-compose.yml logs celery_worker --no-color || true
          docker compose -f docker-compose.yml down -v || true
          exit 1
