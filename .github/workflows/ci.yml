name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        run: pytest backend/tests/ -v --tb=short
      - name: Security scan
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check build
        run: npm run build
      - name: Audit packages
        continue-on-error: true
        run: npm audit --audit-level moderate

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare backend .env
        run: |
          if [ ! -f backend/.env ]; then
            cp backend/.env.example backend/.env || true
          fi
      - name: Build docker compose
        run: docker compose -f docker-compose.yml build
      - name: Test healthchecks
        run: |
          set +e
          docker compose -f docker-compose.yml up -d
          UP_RC=$?
          set -e
          # Poll /health directly so we do not rely solely on compose depends_on.
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health; then
              echo "Backend healthy"
              docker compose -f docker-compose.yml ps
              docker compose -f docker-compose.yml down -v
              exit 0
            fi
            echo "Waiting for backend health... attempt $i"
            sleep 5
          done
          echo "=== compose ps ==="
          docker compose -f docker-compose.yml ps || true
          echo "=== backend logs ==="
          docker compose -f docker-compose.yml logs backend --no-color || true
          echo "=== celery logs ==="
          docker compose -f docker-compose.yml logs celery_worker --no-color || true
          docker compose -f docker-compose.yml down -v || true
          exit 1
