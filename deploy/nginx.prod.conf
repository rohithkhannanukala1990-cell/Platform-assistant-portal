events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # HA upstream — two API replicas (Phase G7)
    upstream backend {
        least_conn;
        server api_1:8000 max_fails=3 fail_timeout=30s;
        server api_2:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen       80;
        server_name  _;

        location = /health {
            proxy_pass         http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /health/live {
            proxy_pass         http://backend/health/live;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location = /health/ready {
            proxy_pass         http://backend/health/ready;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location = /ready {
            proxy_pass         http://backend/ready;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering    off;
        }

        location /auth/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /metrics {
            # Prometheus scrapes api_1/api_2 directly on the Docker network.
            # Deny public edge exposure (ID-075).
            deny all;
            return 403;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        gzip            on;
        gzip_min_length 1024;
        gzip_types      text/plain application/json application/javascript text/css;
    }
}
