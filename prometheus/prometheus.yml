global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # HA prod compose services (deploy/docker-compose.prod.yml)
  - job_name: "aiops-api"
    static_configs:
      - targets: ["api_1:8000", "api_2:8000"]
    metrics_path: "/metrics"

  # Local single-service compose alias (optional)
  - job_name: "aiops-backend-dev"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
